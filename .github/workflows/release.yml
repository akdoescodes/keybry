# Publishes to npm when a version tag is pushed: `npm version patch && git push --follow-tags`.
#
# Uses npm trusted publishing, so there is no token to store or renew. One-time setup, after the
# first version is on npm: npmjs.com > package keybry > Settings > Trusted publisher > GitHub Actions,
# with owner akdoescodes, repository keybry, workflow release.yml.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # trusted publishing; npm also attaches provenance with it

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1 or newer
      - run: npm ci
      # prepublishOnly runs typecheck, tests, build and the size check first.
      - run: npm publish --access public
