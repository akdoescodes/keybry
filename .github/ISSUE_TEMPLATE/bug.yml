name: Bug report
description: Something moved wrong, or didn't move.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device, OS and browser
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: A link or a small code sample. A trace from the test page helps most.
